<svg fill="none" viewBox="0 0 1000 320" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: center;
    }
    .orb-2 {
      animation: pulseOrb2 9s ease-in-out infinite;
      transform-origin: center;
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: dashStream 2s linear infinite;
    }
    .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 5s ease-in-out infinite 0.5s; }
    .pill-3 { animation: floatPill3 4.5s ease-in-out infinite 1s; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="2"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="200" cy="100" r="120" fill="url(#glowGrad)" filter="url(#blurFilter)" />
  <circle class="orb-2" cx="800" cy="220" r="140" fill="#ec4899" opacity="0.15" filter="url(#blurFilter)" />
  <circle class="orb-1" cx="500" cy="260" r="100" fill="#8b5cf6" opacity="0.2" filter="url(#blurFilter)" />

  <!-- Animated Data Flow Grid / Packets in background -->
  <g opacity="0.3">
    <path class="flow-line" d="M 50 80 Q 250 40 500 80 T 950 80" stroke="#3B82F6" stroke-width="1.5" fill="none" />
    <path class="flow-line" d="M 50 250 Q 250 290 500 250 T 950 250" stroke="#8B5CF6" stroke-width="1.5" fill="none" />
    <path class="flow-line" d="M 120 20 L 120 300" stroke="#374151" stroke-width="1" fill="none" />
    <path class="flow-line" d="M 880 20 L 880 300" stroke="#374151" stroke-width="1" fill="none" />
  </g>

  <!-- Floating Dynamic Protocol Badges (Lower Area, Non-overlapping) -->
  <g class="pill-1" transform="translate(180, 245)">
    <rect width="110" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8" />
    <text x="30" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">GET /api/v1</text>
  </g>

  <g class="pill-2" transform="translate(435, 245)">
    <rect width="130" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="30" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">200 OK • 18ms</text>
  </g>

  <g class="pill-3" transform="translate(710, 245)">
    <rect width="125" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="14" r="4" fill="#c084fc" />
    <text x="30" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">GraphQL &amp; gRPC</text>
  </g>

  <!-- Foreground Title and Subtitle (Crisp, High Contrast, Foreground Layer) -->
  <!-- Category Tag -->
  <rect x="410" y="38" width="180" height="26" rx="13" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="500" y="55" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CURATED AWESOME LIST</text>

  <!-- Main Title -->
  <text x="500" y="125" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
    Awesome HTTP Clients
  </text>

  <!-- Subtitle -->
  <text x="500" y="165" text-anchor="middle" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
    The Definitive Guide to Modern API Debugging, Testing Tools &amp; Local-First Clients
  </text>

  <!-- Feature keywords summary line -->
  <text x="500" y="200" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" letter-spacing="0.5">
    ⚡ REST • GraphQL • gRPC • WebSocket • Git-Native Collections • CI/CD Automation
  </text>
</svg>
